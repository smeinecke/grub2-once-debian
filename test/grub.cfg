# Test fixture mimicking a real GRUB 2.12 generated config:
# env block handling, compound statements, submenu, dead branches,
# indented comments. Entry numbering must match what real GRUB sees.
serial --speed=115200 --unit=0
terminal_input serial
terminal_output serial

set root='hd0,gpt1'

if [ -s $prefix/grubenv ]; then
  set have_grubenv=true
  load_env
fi
if [ "${next_entry}" ] ; then
   set default="${next_entry}"
   set next_entry=
   save_env next_entry
   set boot_once=true
else
   set default="0"
fi
set timeout=5

if [ "${grub_platform}" = "x" ]; then if [ "a" = "b" ]; then
  menuentry 'nested-dead-branch' {
      linux /vmlinuz
  }
fi; fi

menuentry 'default system' --class gnu-linux {
    linux /vmlinuz root=/dev/vda1 ro console=ttyS0
    initrd /initrd.img
}

submenu 'advanced options' {
    menuentry 'oneshot target' {
        linux /vmlinuz root=/dev/vda1 ro console=ttyS0 grub_once_marker=1
        initrd /initrd.img
    }
}

if [ "x" = "y" ]; then
    menuentry 'dead-branch' { linux /vmlinuz; }
fi

   # menuentry 'indented-comment' { linux /vmlinuz; }
